<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YARI Device Setup</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; background: #0b0f14; color: #eef5ff; display: grid; place-items: center; }
    main { width: min(680px, calc(100vw - 32px)); padding: 32px; box-sizing: border-box; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 42px); letter-spacing: 0; }
    p { color: #aab7c4; line-height: 1.55; }
    form { display: grid; gap: 16px; margin-top: 24px; }
    label { display: grid; gap: 7px; color: #d7e2ee; font-weight: 600; }
    input { border: 1px solid #334252; border-radius: 8px; background: #121922; color: #eef5ff; padding: 12px 13px; font-size: 16px; }
    button { border: 0; border-radius: 8px; background: #38bdf8; color: #041016; font-weight: 800; padding: 13px 16px; font-size: 16px; cursor: pointer; }
    button.secondary { background: #233142; color: #eef5ff; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; }
    .row button { flex: 1 1 180px; }
    .status { margin-top: 18px; white-space: pre-wrap; color: #c6d5e3; background: #111820; border: 1px solid #2a3948; border-radius: 8px; padding: 14px; min-height: 20px; }
  </style>
</head>
<body>
  <main>
    <h1>YARI Device Setup</h1>
    <p>Connect this robot to your Wi-Fi network. After saving, the device will reboot and join the configured network.</p>
    <form id="setup-form">
      <label>Wi-Fi SSID<input name="ssid" autocomplete="off" required></label>
      <label>Wi-Fi password<input name="password" type="password" autocomplete="current-password" required></label>
      <label>Hostname<input name="hostname" autocomplete="off" value="tortoisebot"></label>
      <div class="row">
        <button type="submit">Save and reboot</button>
        <button class="secondary" type="button" id="status-button">Refresh status</button>
      </div>
    </form>
    <div class="status" id="status">Loading status...</div>
  </main>
  <script>
    const statusEl = document.querySelector('#status');
    async function refreshStatus() {
      try {
        const response = await fetch('/api/status');
        const data = await response.json();
        statusEl.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        statusEl.textContent = `Unable to read status: ${error}`;
      }
    }
    document.querySelector('#status-button').addEventListener('click', refreshStatus);
    document.querySelector('#setup-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const body = Object.fromEntries(new FormData(event.currentTarget).entries());
      statusEl.textContent = 'Saving network settings...';
      try {
        const response = await fetch('/api/configure', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await response.json();
        statusEl.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        statusEl.textContent = `Save failed: ${error}`;
      }
    });
    refreshStatus();
  </script>
</body>
</html>
